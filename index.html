<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto MU Control Center</title><style>body{margin:0;font-family:Segoe UI,Arial;background:#0f1115;color:#eef2f7}.wrap{max-width:1400px;margin:auto;padding:16px}.card,.panel{background:#171a21;border:1px solid #2b313d;border-radius:14px;padding:14px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.badge{padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}.ok{color:#45d483;background:#1c3829}.bad{color:#ff6b6b;background:#3a2020}.muted{color:#9aa4b2;font-size:13px}input,button{background:#1e222b;color:#eef2f7;border:1px solid #2b313d;border-radius:10px;padding:10px}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:10px;border-bottom:1px solid #2b313d;text-align:left;font-size:13px;white-space:nowrap}.scroll{overflow:auto}.hidden{display:none}.login{max-width:520px;margin:12vh auto}.alert{padding:10px 0;border-bottom:1px solid #2b313d}</style></head><body><div class="wrap"><div id="login" class="card login"><h2>Auto MU Control Center</h2><div class="muted">Nhập Dashboard Token một lần trên thiết bị này.</div><input id="tok" type="password" placeholder="Dashboard Token" style="width:100%;margin:10px 0"><button id="go" style="width:100%">Kết nối</button><div id="msg" class="muted" style="margin-top:8px"></div></div><div id="app" class="hidden"><div class="top"><div><h2 style="margin:0">Auto MU Control Center</h2><div id="info" class="muted"></div></div><div><input id="q" placeholder="Tìm nhân vật..."><button id="refresh">Làm mới</button><button id="forget">Quên Token</button></div></div><div id="machines" class="grid" style="margin-top:14px"></div><div class="panel"><h3>Nhân vật</h3><div class="scroll"><table><thead><tr><th>PC</th><th>Nhân vật</th><th>Trạng thái</th><th>Map/Sub</th><th>Sheet</th><th>Incident</th><th>Locked</th><th>Retry</th><th>PID</th><th>Cập nhật</th></tr></thead><tbody id="chars"></tbody></table></div></div><div class="panel"><h3>Cảnh báo gần đây</h3><div id="alerts"></div></div></div></div><script>const U='https://uaiqnqiewobswthdftrq.supabase.co',K='sb_publishable_X3akoHipa55_FRMjoJBIKw_LG_xGwL5';let T=localStorage.getItem('automu_dash')||'',C=[],MN={};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>v?new Date(v).toLocaleString('vi-VN',{hour12:false}):'--';async function rpc(n,b){let r=await fetch(U+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw Error(await r.text());return r.json()}function alive(v){return v&&Date.now()-new Date(v).getTime()<20000}function renderM(a){$('machines').innerHTML=a.map(x=>'<div class="card"><b>'+esc(x.machine_name||x.machine_id)+'</b> <span class="badge '+(alive(x.last_seen)?'ok':'bad')+'">'+(alive(x.last_seen)?'ONLINE':'OFFLINE')+'</span><div class="muted">Heartbeat: '+fmt(x.last_seen)+'</div></div>').join('')}function renderC(){let f=$('q').value.toLowerCase();let a=C.filter(x=>!f||(x.character_name||'').toLowerCase().includes(f)||(x.machine_id||'').toLowerCase().includes(f)||(MN[x.machine_id]||'').toLowerCase().includes(f));$('chars').innerHTML=a.map(x=>'<tr><td>'+esc(MN[x.machine_id]||x.machine_id)+'</td><td><b>'+esc(x.character_name)+'</b></td><td><span class="badge '+((x.status||'').toLowerCase().includes('offline')?'bad':'ok')+'">'+esc(x.status||'--')+'</span></td><td>'+(x.map_id??'--')+' / '+(x.sub_id??'--')+'</td><td>'+esc(x.active_sheet||'--')+'</td><td>'+(x.incident_count??0)+'/'+(x.incident_limit??0)+'</td><td>'+(x.train_locked?'Có':'Không')+'</td><td>'+(x.retry_seconds==null?'--':x.retry_seconds+'s')+'</td><td>'+(x.pid??'--')+'</td><td>'+fmt(x.updated_at)+'</td></tr>').join('')}function renderA(a){$('alerts').innerHTML=a.length?a.map(x=>'<div class="alert"><b>'+esc(x.message||((x.character_name||'')+' đã Offline trên '+(MN[x.machine_id]||x.machine_id)))+'</b><div class="muted">'+fmt(x.created_at)+'</div></div>').join(''):'<div class="muted">Chưa có cảnh báo.</div>'}async function load(login=false){try{let [m,c,a]=await Promise.all([rpc('dashboard_get_machines',{p_token:T}),rpc('dashboard_get_characters',{p_token:T}),rpc('dashboard_get_alerts',{p_token:T,p_limit:50})]);$('login').classList.add('hidden');$('app').classList.remove('hidden');localStorage.setItem('automu_dash',T);MN={};(m||[]).forEach(x=>MN[x.machine_id]=x.machine_name||x.machine_id);C=c||[];renderM(m||[]);renderC();renderA(a||[]);$('info').textContent='Cập nhật: '+new Date().toLocaleTimeString('vi-VN',{hour12:false})+' • tự làm mới 5 giây'}catch(e){if(login)$('msg').textContent='Token sai hoặc chưa chạy SQL setup.';else $('info').textContent='Lỗi kết nối'}}$('go').onclick=()=>{T=$('tok').value.trim();if(T)load(true)};$('refresh').onclick=()=>load();$('forget').onclick=()=>{localStorage.removeItem('automu_dash');location.reload()};$('q').oninput=renderC;if(T)load(true);setInterval(()=>{if(T&&!$('app').classList.contains('hidden'))load()},5000);</script></body></html>
