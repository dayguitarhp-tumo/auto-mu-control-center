<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto MU Control Center</title><style>body{margin:0;font-family:Segoe UI,Arial;background:#0f1115;color:#eef2f7}.wrap{max-width:1400px;margin:auto;padding:16px}.card,.panel{background:#171a21;border:1px solid #2b313d;border-radius:14px;padding:14px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.badge{padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}.ok{color:#45d483;background:#1c3829}.bad{color:#ff6b6b;background:#3a2020}.warn{color:#ffd166;background:#443819}.neutral{color:#b8c0cc;background:#2a2f38}.muted{color:#9aa4b2;font-size:13px}input,button{background:#1e222b;color:#eef2f7;border:1px solid #2b313d;border-radius:10px;padding:10px}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:10px;border-bottom:1px solid #2b313d;text-align:left;font-size:13px;white-space:nowrap}.scroll{overflow:auto}.hidden{display:none}.login{max-width:520px;margin:12vh auto}.alert{padding:10px 0;border-bottom:1px solid #2b313d}
.pc-badge{display:inline-block;padding:4px 9px;border-radius:999px;font-weight:700;font-size:12px;line-height:1.2}
.pc-home{background:#203a5c;color:#9dccff}
.pc-office{background:#3a2854;color:#d7b8ff}
.pc-papa{background:#4a3420;color:#ffd39b}
.pc-lapdell{background:#173f3d;color:#9ce5de}
.pc-default{background:#2a2f38;color:#c6ccd6}
.pc-group-start td{border-top:2px solid #3d4654}
</style></head><body><div class="wrap"><div id="login" class="card login"><h2>Auto MU Control Center</h2><div class="muted">Nhập Dashboard Token một lần trên thiết bị này.</div><input id="tok" type="password" placeholder="Dashboard Token" style="width:100%;margin:10px 0"><button id="go" style="width:100%">Kết nối</button><div id="msg" class="muted" style="margin-top:8px"></div></div><div id="app" class="hidden"><div class="top"><div><h2 style="margin:0">Auto MU Control Center</h2><div id="info" class="muted"></div></div><div><input id="q" placeholder="Tìm nhân vật..."><button id="refresh">Làm mới</button><button id="forget">Quên Token</button></div></div><div id="machines" class="grid" style="margin-top:14px"></div><div class="panel"><h3>Nhân vật</h3><div class="scroll"><table><thead><tr><th>PC</th><th>Nhân vật</th><th>Trạng thái</th><th>Map/Sub</th><th>Sheet</th><th>Incident</th><th>Locked</th><th>Retry</th><th>PID</th><th>Cập nhật</th></tr></thead><tbody id="chars"></tbody></table></div></div><div class="panel"><h3>Cảnh báo gần đây</h3><div id="alerts"></div></div></div></div><script>const U='https://uaiqnqiewobswthdftrq.supabase.co',K='sb_publishable_X3akoHipa55_FRMjoJBIKw_LG_xGwL5';let T=localStorage.getItem('automu_dash')||'',C=[],MN={},MO={};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>v?new Date(v).toLocaleString('vi-VN',{hour12:false}):'--';async function rpc(n,b){let r=await fetch(U+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw Error(await r.text());return r.json()}function alive(v){return v&&Date.now()-new Date(v).getTime()<20000}function renderM(a){$('machines').innerHTML=a.map(x=>'<div class="card"><b>'+esc(x.machine_name||x.machine_id)+'</b> <span class="badge '+(alive(x.last_seen)?'ok':'bad')+'">'+(alive(x.last_seen)?'ONLINE':'OFFLINE')+'</span><div class="muted">Heartbeat: '+fmt(x.last_seen)+'</div></div>').join('')}function isDiTrain(x){
let sh=String(x.active_sheet||'').normalize('NFC').toLowerCase().trim();
return sh==='đi train'||sh==='di train'
}
function displayStatus(x){
if(MO[x.machine_id]===false)return'Offline';
if(isDiTrain(x))return'Đang lên bãi';
return x.status||'--'
}function pcClass(id){
if(id==='PC01')return'pc-home';
if(id==='PC02')return'pc-office';
if(id==='PC03')return'pc-papa';
if(id==='PC04')return'pc-lapdell';
return'pc-default'
}
function pcLabel(x){
return '<span class="pc-badge '+pcClass(x.machine_id)+'">'+esc(MN[x.machine_id]||x.machine_id)+'</span>'
}
function charBadge(x){
if(MO[x.machine_id]===false)return'bad';
let s=String(x.status||'').normalize('NFC').toLowerCase();
let sh=String(x.active_sheet||'').normalize('NFC').toLowerCase().trim();
if(x.train_locked||s.includes('offline')||s.includes('chết')||s.includes('chet')||s.includes('dead'))return'bad';
if(isDiTrain(x))return'warn';
if(sh&&sh!='--')return'warn';
if(s.includes('đứng yên')||s.includes('dung yen'))return'bad';
if(s.includes('train'))return'ok';
return'neutral'
}function renderC(){
let f=$('q').value.toLowerCase();
let a=C.filter(x=>!f||(x.character_name||'').toLowerCase().includes(f)||(x.machine_id||'').toLowerCase().includes(f)||(MN[x.machine_id]||'').toLowerCase().includes(f));
let prev='';
$('chars').innerHTML=a.map(x=>{
let cls=prev&&prev!==x.machine_id?' class="pc-group-start"':'';
prev=x.machine_id;
return '<tr'+cls+'><td>'+pcLabel(x)+'</td><td><b>'+esc(x.character_name)+'</b></td><td><span class="badge '+charBadge(x)+'">'+esc(displayStatus(x))+'</span></td><td>'+(x.map_id??'--')+' / '+(x.sub_id??'--')+'</td><td>'+esc(x.active_sheet||'--')+'</td><td>'+(x.incident_count??0)+'/'+(x.incident_limit??0)+'</td><td>'+(x.train_locked?'Có':'Không')+'</td><td>'+(x.retry_seconds==null?'--':x.retry_seconds+'s')+'</td><td>'+(x.pid??'--')+'</td><td>'+fmt(x.updated_at)+'</td></tr>'
}).join('')
}
function renderA(a){$('alerts').innerHTML=a.length?a.map(x=>'<div class="alert"><b>'+esc(x.message||((x.character_name||'')+' đã Offline trên '+(MN[x.machine_id]||x.machine_id)))+'</b><div class="muted">'+fmt(x.created_at)+'</div></div>').join(''):'<div class="muted">Chưa có cảnh báo.</div>'}async function load(login=false){try{let [m,c,a]=await Promise.all([rpc('dashboard_get_machines',{p_token:T}),rpc('dashboard_get_characters',{p_token:T}),rpc('dashboard_get_alerts',{p_token:T,p_limit:5})]);$('login').classList.add('hidden');$('app').classList.remove('hidden');localStorage.setItem('automu_dash',T);MN={};MO={};(m||[]).forEach(x=>{MN[x.machine_id]=x.machine_name||x.machine_id;MO[x.machine_id]=!!alive(x.last_seen)});C=c||[];renderM(m||[]);renderC();renderA(a||[]);$('info').textContent='Cập nhật: '+new Date().toLocaleTimeString('vi-VN',{hour12:false})+' • tự làm mới 5 giây'}catch(e){if(login)$('msg').textContent='Token sai hoặc chưa chạy SQL setup.';else $('info').textContent='Lỗi kết nối'}}$('go').onclick=()=>{T=$('tok').value.trim();if(T)load(true)};$('refresh').onclick=()=>load();$('forget').onclick=()=>{localStorage.removeItem('automu_dash');location.reload()};$('q').oninput=renderC;if(T)load(true);setInterval(()=>{if(T&&!$('app').classList.contains('hidden'))load()},5000);</script></body></html>
